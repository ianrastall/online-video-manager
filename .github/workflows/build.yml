name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./scripts/Build.ps1
      - run: dotnet test --project tests/OnlineVideoManager.Tests
      - shell: pwsh
        run: ./scripts/Smoke-Native.ps1
      - shell: pwsh
        run: ./scripts/Smoke-App.ps1
      - shell: pwsh
        run: ./scripts/Package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: OVM-x64-unsigned
          path: artifacts/installer/*
